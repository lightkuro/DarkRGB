[package]
name = "darkrgb-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
log = "0.4.35"
darkrgb-core = { path = "../core" }
rtrb = "0.4.1"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }

# Windows and macOS capture through cpal (WASAPI loopback, CoreAudio tap).
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18"

# Linux speaks the PulseAudio protocol directly, which PipeWire also answers.
# The client is pure Rust, so there is nothing extra to install or link.
[target.'cfg(target_os = "linux")'.dependencies]
pulseaudio = "0.3"
futures = { version = "0.3", default-features = false, features = ["executor"] }

[dev-dependencies]
env_logger = "0.11"
