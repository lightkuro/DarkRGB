[package]
name = "darkrgb-desktop"
description = "darkRGB as a desktop app: the engine and its UI in one window"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "darkrgb"
path = "src/main.rs"

[dependencies]
darkrgb-engine = { path = "../engine" }
dirs = "7.0.0"
env_logger = "0.11.11"
log = "0.4.35"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
