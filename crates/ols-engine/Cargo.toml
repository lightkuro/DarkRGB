[package]
name = "ols-engine"
description = "OpenLightShow engine and UI server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "openlightshow"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
env_logger = "0.11.11"
futures-util = "0.3.34"
log = "0.4.35"
mime_guess = "2.0.5"
ols-audio = { version = "0.1.0", path = "../ols-audio" }
ols-core = { version = "0.1.0", path = "../ols-core" }
ols-output = { version = "0.1.0", path = "../ols-output" }
open = "5.4.5"
rust-embed = { version = "8.13.0", features = ["interpolate-folder-path"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spin_sleep = "1.3.3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }

[dev-dependencies]
ols-sim = { path = "../ols-sim" }
tokio-tungstenite = "0.30.0"
