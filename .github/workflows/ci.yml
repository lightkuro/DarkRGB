name: CI

# Builds start only when asked for: Actions tab, "CI", "Run workflow", pick
# the branch. Nothing runs on a push, so build minutes are spent on purpose.
on:
  workflow_dispatch:

# Starting a build for a branch replaces one still running for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Shown in the app next to the version, and used in the download's name,
  # so a bug report can say exactly which build it came from.
  DARKRGB_BUILD: ${{ github.run_number }}

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            exe: ""
          - os: windows-latest
            platform: windows-x64
            exe: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the UI
        working-directory: ui
        run: |
          npm install --global pnpm@10
          pnpm install --frozen-lockfile
          pnpm build

      # The app window needs GTK and WebKit to build on Linux.
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev

      # The version comes from rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting and lints
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      # Tests run on the release build, so the programs attached below are
      # the ones that were tested, and everything compiles once.
      - name: Test
        run: cargo test --workspace --release

      - name: Build release programs
        run: cargo build --release -p darkrgb-desktop -p darkrgb-engine

      - name: Read the version
        id: version
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Collect programs
        shell: bash
        run: |
          mkdir dist
          cp target/release/darkrgb${{ matrix.exe }} dist/
          cp target/release/darkrgb-cli${{ matrix.exe }} dist/
          cp LICENSE CHANGELOG.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: darkRGB-${{ steps.version.outputs.version }}-build${{ github.run_number }}-${{ matrix.platform }}
          path: dist/
          # Kept a week: stored downloads count against the account's 500 MB.
          retention-days: 7
